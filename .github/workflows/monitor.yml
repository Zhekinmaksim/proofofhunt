name: Studionet beta health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: beta-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix scripts ci
      - name: Read race and bounded pending-attempt status
        run: |
          address=$(node --input-type=module -e "import {CONTRACT} from './web/config.js'; console.log(CONTRACT)")
          node scripts/monitor_race.mjs --network studionet --address "$address" --max-commits 200 --interval-ms 2500 --output beta-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-health
          path: beta-health.json
